[package]
name = "nico_robin_bot"
version = "0.2.0"
edition = "2021"
authors = ["johan-droid <sahooashutosh2022@gmail.com>"]
autobins = false

[lib]
crate-type = ["cdylib"]
path = "src/main.rs"

[dependencies]
tokio = { version = "1.38", default-features = false, features = ["macros", "sync", "rt", "io-util", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
envy = "0.4"
dotenvy = "0.15"
tokio-postgres = { version = "0.7", default-features = false, features = ["with-chrono-0_4", "with-serde_json-1"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
uuid = { version = "1.24.0", features = ["v4", "js"] }
worker = "0.4"
wasm-bindgen-futures = "0.4"

getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom = { version = "0.4", features = ["wasm_js"] }

[[bin]]
name = "migrate"
path = "src/bin/migrate.rs"
