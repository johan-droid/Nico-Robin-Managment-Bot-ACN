[package]
name = "nico_robin_bot"
version = "0.2.0"
edition = "2021"
authors = ["johan-droid <sahooashutosh2022@gmail.com>"]
default-run = "nico_robin_bot"
autobins = false

[lib]
crate-type = ["rlib"]
path = "src/lib.rs"

[[bin]]
name = "nico_robin_bot"
path = "src/main.rs"

[[bin]]
name = "migrate"
path = "src/bin/migrate.rs"

[[bin]]
name = "diagnose"
path = "src/bin/diagnose.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
envy = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
async-trait = "0.1"
futures-util = "0.3"
url = "2.5"
hex = "0.4"
aes-gcm = "0.10"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
tokio = { version = "1.38", default-features = false, features = ["macros", "sync", "rt", "rt-multi-thread", "io-util", "time"] }
dotenvy = "0.15"
tokio-postgres = { version = "0.7", default-features = false, features = ["with-chrono-0_4", "with-serde_json-1", "runtime"] }
deadpool-postgres = { version = "0.14", default-features = false, features = ["serde", "rt_tokio_1"] }
uuid = { version = "1.24.0", features = ["v4"] }
axum = { version = "0.7", features = ["default", "json", "macros"] }
hyper = { version = "1.0", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "blocking", "multipart"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
native-tls = "0.2"
postgres-native-tls = "0.5"
sentry = { version = "0.48.5", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "native-tls"] }