[package]
name = "nico_robin_bot"
version = "0.2.0"
edition = "2021"
authors = ["johan-droid <sahooashutosh2022@gmail.com>"]
default-run = "nico_robin_bot"
autobins = false

[lib]
crate-type = ["rlib", "cdylib"]
path = "src/lib.rs"

[[bin]]
name = "nico_robin_bot"
path = "src/main.rs"

[[bin]]
name = "migrate"
path = "src/bin/migrate.rs"

[[bin]]
name = "diagnose"
path = "src/bin/diagnose.rs"

[dependencies]
tokio = { version = "1.38", default-features = false, features = ["macros", "sync", "rt", "rt-multi-thread", "io-util", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
envy = "0.4"
dotenvy = "0.15"
tokio-postgres = { version = "0.7", default-features = false, features = ["with-chrono-0_4", "with-serde_json-1", "runtime"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
uuid = { version = "1.24.0", features = ["v4"] }
worker = "0.4"
wasm-bindgen-futures = "0.4"
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
futures-util = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio-postgres = { version = "0.7", default-features = false, features = ["with-chrono-0_4", "with-serde_json-1", "js", "runtime"] }
uuid = { version = "1.24.0", features = ["v4", "js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { version = "0.7", features = ["default", "json", "macros"] }
hyper = { version = "1.0", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "blocking"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
native-tls = "0.2"
postgres-native-tls = "0.5"
sentry = { version = "0.48.5", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "native-tls"] }