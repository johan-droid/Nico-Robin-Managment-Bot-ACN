name = "nico-robin-bot"
main = "build/worker/shim.mjs"
compatibility_date = "2024-01-01"

[build]
command = "cargo install worker-build --version \"<0.2.0\" && worker-build --release"

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "dummy_id_replace_with_actual"

[[durable_objects.bindings]]
name = "CHAT_STATE"
class_name = "ChatState"

[[migrations]]
tag = "v1"
new_classes = ["ChatState"]

[vars]
ENVIRONMENT = "production"
BOT_MODE = "webhook"
BOT_NAME = "Nico Robin"
DEFAULT_LOCALE = "en"
DEFAULT_PREFIX = "/"
ALLOWED_GROUP_IDS = "-1004380308308"
AI_MODERATION_ENABLED = "false"
AI_SCORE_THRESHOLD = "0.75"
LLM_PROVIDER = "disabled"
OPENAI_MODERATION_MODEL = "gpt-4o-mini"
DB_CONNECT_TIMEOUT = "30"
DB_MAX_OVERFLOW = "5"
DB_POOL_RECYCLE = "1800"
DB_POOL_SIZE = "10"
DB_QUERY_TIMEOUT = "30"
DB_SSL_REQUIRED = "false"
LOG_LEVEL = "DEBUG"
LOG_CHANNEL_ID = "0"
SENTRY_DSN = "https://8e2ff3e35405c54a65520893aac7167f@o4511797194194944.ingest.de.sentry.io/4511797202255952"
PORT = "8000"
AUTO_MIGRATE_ON_STARTUP = "true"
METRICS_API_KEY = "dev_metrics_key_change_in_production"
WEBHOOK_SECRET_PATH = "wkC9v7rZq2sH8nX4pL0uF6bT1yM3eR8Q"
WEBHOOK_SECRET = "wkC9v7rZq2sH8nX4pL0uF6bT1yM3eR8Q"
