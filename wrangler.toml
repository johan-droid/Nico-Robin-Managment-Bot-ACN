name = "nico-robin-bot"
main = "backend/build/worker/index.js"
compatibility_date = "2024-01-01"

[build]
command = "cd backend && (command -v worker-build || cargo install worker-build) && worker-build --release"

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "dummy_id_replace_with_actual"

[[durable_objects.bindings]]
name = "CHAT_STATE"
class_name = "ChatState"

[[migrations]]
tag = "v1"
new_classes = ["ChatState"]

[vars]
ENVIRONMENT = "production"
BOT_MODE = "webhook"
ALLOWED_GROUP_IDS = ""
WEBHOOK_SECRET_PATH = "secret-webhook-path"
