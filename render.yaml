services:
  - type: web
    name: nico-robin-bot
    runtime: image
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: WEBHOOK_SECRET_PATH
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: BOT_MODE
        value: polling
      - key: BOT_NAME
        value: Nico Robin
      - key: LOG_LEVEL
        value: INFO
      - key: PORT
        value: "8000"
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_GROUP_IDS
        value: "-1004380308308"
      - key: AI_MODERATION_ENABLED
        value: "false"
      - key: LLM_PROVIDER
        value: disabled
